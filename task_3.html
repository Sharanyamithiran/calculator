<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <div style="height: 300px; width:200px; padding:25px;background-color: rgba(10, 10, 10, 0.963);border-radius: 70px;">
        <button style="height: 30px; width:180px;background-color: bisque;border-radius: 60px;">Welcome to Calculator</button><br><br>
        <input style="height: 20px; width:150px; background-color: aliceblue; border-radius: 20px;text-align-last: right;" type= "tel" placeholder="0"><br><br>

        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; "">AC</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%;">←</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%;">%</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%;">÷</button><br><br>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">7</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">8</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">9</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">×</button><br><br>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">4</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">5</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">6</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">-</button><br><br>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">1</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">2</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">3</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">+</button><br><br>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">0</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">00</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">.</button>
        <button style="height: 30px;width: 30px; background-color: bisque;border-radius: 50%; ">=</button>
    </center>
    </div>
</body>
</html>
